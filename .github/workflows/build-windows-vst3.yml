name: Build NOIZZ IMAGER Windows VST3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure x64 Release build
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compile VST3
        run: cmake --build build --config Release --target NOIZZ_IMAGER_VST3 --parallel

      - name: Package VST3 bundle
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) {
            Write-Error 'Build completed but no .vst3 bundle was found.'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force $plugin.FullName dist/
          Compress-Archive -Path dist/* -DestinationPath NOIZZ-IMAGER-Windows-x64-VST3.zip -Force

      - name: Upload compiled VST3
        uses: actions/upload-artifact@v4
        with:
          name: NOIZZ-IMAGER-Windows-x64-VST3
          path: NOIZZ-IMAGER-Windows-x64-VST3.zip
          if-no-files-found: error
          retention-days: 14
